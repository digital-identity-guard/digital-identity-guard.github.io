name = "digital-identity-guard-ai"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Sites allowed to call this Worker (comma-separated, no trailing slash).
ALLOWED_ORIGINS = "https://digital-identity-guard.github.io"

# Create the namespace with:  npx wrangler kv namespace create RATE_LIMIT
# then paste the id it prints here.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
